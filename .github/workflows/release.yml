name: release

# One release = one `git tag vX.Y.Z && git push --tags`. The tag drives everything;
# package.json's version is the single source the binaries are stamped with (keep the
# tag and package.json version in step before tagging).
#
# Pre-tag manual smokes for the gate-blind spots the contract fixtures fake:
# one real `npm i -g` lifecycle run (shim postinstall), and one launcher
# self-repair against the live registry (the fixture registry mirrors the
# documented metadata shape; live shape drift would pass it).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC — required for npm publish --provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Refresh action pins by resolving each documented major tag to its current commit.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Inherit the toolchain pin from go.mod rather than duplicating the version here.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check Go dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Build exact artifact set
        run: |
          set -euo pipefail
          bash scripts/build-artifacts.sh "$PWD" dist/artifacts

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for tarball in dist/artifacts/redbench-*-*-*.tgz; do
            npm publish "$tarball" --access public --provenance
          done

      - name: Publish wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "dist/artifacts/redbench-$(node -p 'require("./package.json").version').tgz" --access public --provenance
