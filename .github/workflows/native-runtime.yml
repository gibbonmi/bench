name: native runtime

on:
  workflow_call:
    inputs:
      artifact-prefix:
        required: false
        type: string
        default: bench-runtime
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.rows }}
      proven: ${{ steps.proof-matrix.outputs.rows }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Pin the exact Go toolchain from go.mod
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - id: matrix
        run: node scripts/release-plan.mjs . matrix-json | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk);process.stdin.on("end",()=>require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`rows=${data.trim()}\n`))'
      - id: proof-matrix
        run: node scripts/release-plan.mjs . proof-matrix-json | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk);process.stdin.on("end",()=>require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`rows=${data.trim()}\n`))'
      - run: bash scripts/release-preflight.sh --mode verify --phase gate
        env:
          BENCH_REQUIRE_CAPABILITIES: '1'

  artifacts:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Pin the exact Go toolchain from go.mod
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - name: Build the artifact generation
        run: bash scripts/build-artifacts.sh . dist/artifacts
      # One upload, two paths. The action resolves dist as the common root, so the
      # archive root is dist and every consumer downloads into dist.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-artifacts
          path: |
            dist/artifacts
            dist/reproducibility.json
          retention-days: ${{ github.retention_days }}

  native-proof:
    needs: [preflight, artifacts]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.proven) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Pin the exact Go toolchain from go.mod
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-artifacts
          path: dist
      - run: bash scripts/native-proof.sh dist/artifacts "dist/native-proofs/${{ matrix.os }}-${{ matrix.arch }}.json" "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.runner }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-native-proof-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/native-proofs/
          retention-days: ${{ github.retention_days }}

  evidence:
    needs: [artifacts, native-proof]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Pin the exact Go toolchain from go.mod
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-artifacts
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.artifact-prefix || 'bench-runtime' }}-native-proof-*
          path: dist/native-proofs
          merge-multiple: true
      # The offline smoke runs its native journeys under bwrap --unshare-net. Ubuntu
      # 24.04 ships no bubblewrap and restricts unprivileged user namespaces through
      # AppArmor, so the runner provides the sentinel before the smoke runs.
      - name: Provide the offline smoke network sentinel
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Finalize the release evidence
        run: |
          bash scripts/install-govulncheck.sh
          bash scripts/aggregate-native-proofs.sh dist/native-proofs
          bash scripts/release-preflight.sh --mode verify
          bash scripts/smoke-artifacts.sh dist/artifacts dist/preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-native-proof-evidence
          path: dist/native-proofs/
          retention-days: ${{ github.retention_days }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-preflight-evidence
          path: dist/preflight/
          retention-days: ${{ github.retention_days }}

  smoke:
    needs: [preflight, artifacts, evidence]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Pin the exact Go toolchain from go.mod
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-artifacts
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-prefix || 'bench-runtime' }}-preflight-evidence
          path: dist/preflight
      - name: Provide the offline smoke network sentinel
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash scripts/smoke-artifacts.sh dist/artifacts dist/preflight
