  risk: low
  migration: none

- id: A10
  priority: EXPERIMENT
  title: Repair-loop tripwire — advisory `repair_loop` row from gate records
  problem: nothing detects that an agent is patching in a loop; /bench-debug (the mechanism with practitioner evidence) is reviewer-invoked and explicit-only on Codex, so the trigger depends on a human noticing.
  evidence: L-22 (data exists: `.logs/gate-*.jsonl` carries per-phase exit and elapsed per run; bench-last-gate carries status/tree/oracle/time); benefit is HYPOTHESIS
  proposed_change: bench gate emits `repair_loop[1]{phase,attempts,action}` → `/bench-debug` on the second consecutive red with the same first-failing phase (check-level once A1's conformance diagnostics are structured); advisory only; measure against the retro repair-attribution tally already collected by /bench-final-check.
  non_goals: no blocking behavior; no attempt-ledger schema.
  owner_layer: gate output
  dependencies: A1 (structured skip/diagnostic output), A5 (the trigger target exists on both harnesses)
  acceptance_criteria:
    - fixture with two identical-phase reds emits the row; a red with a different first-failing phase does not
  validation: repair rounds per ticket (retro table) and blank-retry rate (A11) before/after; promote to control only if rounds fall
  expected_benefit: the missing trigger for the strongest-evidence behavior
  complexity: low
  risk: false positives → keep advisory
  migration: none

- id: A11
  priority: EXPERIMENT
  title: Measurement harness — arms A/B/C, D/E/F, G with instrumentation; blocks FT100
  problem: 28 prose artifacts and every delegation/line rule have zero controlled evidence; the only comparable study (SWE-Skills-Bench) found most skills neutral and some harmful; FT100 (rank 1) proposes editorial cuts with no measurement; Bench collects no token/tool-call/turn data.
  evidence: L-05, L-11, L-23, L-25 (UNINVESTIGATED by all three audits — by construction)
  proposed_change: >
    Instrument (FT138): per-run tokens, tool calls, files read, duplicate reads,
    gate runs, repair rounds (retro table already), wall time. Task corpus from
    retired specs (`git log --diff-filter=D -- specs/`, parent-of-landing checkouts)
    and FT `Occurrence:` bugs. Arms: A model+AGENTS.md only; B current Bench; C Bench
    after A1–A9; D/E current Bench without/with /bench-debug on bug tasks; F upstream
    diagnosing-bugs vs /bench-debug; G review with commit log withheld vs supplied.
    ≥5 trials per arm per task, medians and spread, both harnesses where possible.
    Pre-registered criteria: B beats A on requirement satisfaction and epistemic
    quality at ≤3× tokens; E beats D on first-fix success and time-to-root-cause;
    C beats B on tokens at equal outcome (the only honest justification for FT100);
    G decides the commit-log question. Leave-one-out over the 16 craft skills.
  non_goals: no prose cuts, no skill deletions, no delegation-rule changes before results.
  owner_layer: benchmark suite (new, kit-only) + instrumentation in gate/final-check
  dependencies: A1–A3 for arm C; none for A/B/D/E/F/G
  acceptance_criteria:
    - harness runs one task across arms unattended and emits the metric table
    - pre-registration file committed before the first scored run
  validation: the harness is its own validation; results feed FT100/FT170's decisions
  expected_benefit: every future guidance change becomes a measured change
  complexity: high (evaluation compute/time)
  risk: results may show Bench's prose layer is neutral — that is a finding, not a failure
  migration: none

- id: A12
  priority: DELETE
  title: Do not build — canonical work-state store, context compiler, typed claim graph, executable review runner, or a strangler spine
  problem: Sol's T.1–T.3 and R propose a new spine (router + work record + compiler + typed evidence) in front of existing modules; none rests on an observed failure that the incremental items above do not address, and each would create a second reader of facts Bench already single-sources.
  evidence: L-04, L-05, L-23, L-24, L-26 — every reproduced defect is local; the deterministic core held under every probe
  proposed_change: record the decision; revisit only if A11 produces an observed failure (context, resume, or review independence) that A3/A8 do not close.
  non_goals: this is not a rejection of the *concerns* — they are carried by A3 (entry), A8 (state), A9/A11 (context), A10/A5 (empirical escape).
  owner_layer: doctrine
  dependencies: A11
  acceptance_criteria: the decision is written in the roadmap's dependency/goal-track section
  validation: A11 results
  expected_benefit: avoids months of migration and duplicated truth
  complexity: n/a
  risk: if A11 shows resume/context failures, the answer is a bounded extension of A8, not a spine
  migration: n/a
