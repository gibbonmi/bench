  problem: bench-debug preserves the four load-bearing constraints but dropped the loop-construction menu (10→5), the two hard stop-gates and checkbox completion form, and "tighten the loop"; the personal upstream skill is switched off in this repo, and $bench-debug cannot self-invoke on Codex; there is no Claude-side invocation-policy check.
  evidence: L-10, L-11, L-30 (REPRODUCED textually against pinned upstream d574778f); PRACTITIONER EVIDENCE for the mechanism's value
  proposed_change: >
    Add references/loop-constructions.md behind a Phase 1 pointer (the ten
    constructions + HITL); restore "No red-capable command, no Phase 2", "Do not
    proceed until reproduced and minimised", and the `- [ ]` completion checklist;
    restore "Tighten the loop" as a named step; move the Bench-mechanics tail behind a
    pointer; fold FT112's approximation rule in. Reviewer decision recorded in the
    same change: `$bench-debug` allow_implicit_invocation on Codex (yes/no) — if no,
    A10's tripwire is the trigger. Add the Claude-side mirror of
    checkCodexCommandAdapters and delete the inert disable-model-invocation key from
    the 11 Codex SKILL.md files.
  non_goals: no compression, no rewrite, no replacement; no benchmark-driven deletion before A11 arms D/E/F run.
  owner_layer: skill (phase file + reference) + conformance (parity check) + adapters
  dependencies: A1 (the phase file's structural contract is graded)
  acceptance_criteria:
    - side-by-side diff against upstream shows each restored constraint
    - phase file stays within its prose budget (reference file carries the menu)
    - parity check bites on a Claude phase whose policy disagrees with the Codex adapter
  validation: A11 arms E/F (Bench-integrated vs upstream) — steps to first reproduction, root-cause-before-fix, first-fix success, original-signal rerun
  expected_benefit: preserves the one behavior with repeated practitioner evidence and reaches it from both harnesses
  complexity: low
  risk: low
  migration: none

- id: A6
  priority: P1
  title: Kit tests stop writing into the operator's real BENCH_HOME
  problem: internal/worktree reauthorize fixtures create pool worktrees under the ambient BENCH_HOME and never remove them — 759 orphaned `001-*` dirs (41 MB) in ~/.bench/worktrees, ~10 added per gate run; Sol's E006 subject pollution is the same leak under a subject-pointing BENCH_HOME.
  evidence: L-06 (OBSERVED before/after two gate runs; owner located by rg)
  proposed_change: isolate BENCH_HOME in the worktree package test helper (newWorktreeRepo/mustCreate) or TestMain; add an assertion that the ambient pool listing is unchanged by a package run; document a one-off operator prune (out of the ticket).
  non_goals: no change to production pool resolution.
  owner_layer: tests (worktree package)
  dependencies: none
  acceptance_criteria:
    - `go test ./internal/worktree` leaves ~/.bench/worktrees byte-identical
    - the assertion bites when the Setenv is removed
  validation: the assertion; `ls ~/.bench/worktrees | wc -l` stable across gate runs
  expected_benefit: hygiene; faster `bench worktree` scans on the operator's machine; removes a confusing artifact class from every future audit
  complexity: trivial
  risk: none
  migration: operator prunes existing orphans once

- id: A7
  priority: P1
  title: The release workflow publishes only through bench release submit/promote
  problem: .github/workflows/release.yml publishes with raw `npm publish` in two steps, bypassing the resumable, digest-verified state machine the runbook requires; a partial publication cannot be resumed or rolled back through Bench.
  evidence: L-13 (REPRODUCED statically; ASSESSMENT.md §6 already records it)
  proposed_change: replace the two publish steps with `bench release submit`/`promote` (or gate raw publish behind a refusal); keep the preflight ordering; document in the runbook.
  non_goals: no release performed as part of the fix; no change to artifact assembly.
  owner_layer: release (workflow + Bench core release commands)
  dependencies: none (must land before the next release; deployment is NO-GO today)
  acceptance_criteria:
    - workflow dry-run/fixture shows the raw path absent and submit/promote invoked with the release-index digest
    - runbook and workflow agree
  validation: a dry-run against a local registry (the release-preflight rehearsal path already exists)
  expected_benefit: publication is resumable and evidence-bound; closes an ASSESSMENT.md finding that has sat since 2026-08-13
  complexity: medium (CI + release commands, credentials scoping)
  risk: medium — needs a live registry rehearsal before trusting it
  migration: none

- id: A8
  priority: P2
  title: Minimal work-state extension — constrain handoff `## State` and carry the repro / next discriminator
  problem: the handoff pin block is regenerated but `## State` is free prose that was wrong on three facts at HEAD; a bug's repro command and the next discriminating action live nowhere durable, so a resuming session (or model) rebuilds them; three surfaces answer "Next" independently.
  evidence: L-04, L-07 (REPRODUCED); Opus K; Sol K (the need for a *new* store is UNSUPPORTED)
  proposed_change: handoff shape: `## State` limited to assertions the tree can contradict (branch, spec status, dirty count, gate verdict — mostly generated) plus at most a few lines; add an optional `Repro:` line (command + expected red) written by /bench-debug and by the blocked-delegate report; `## Next command` becomes the router's output (A3). Extend handoff-shape conformance accordingly.
  non_goals: no Goal/Core/Verified/Open/Next file; no attempt ledger schema; no context compiler.
  owner_layer: handoff (Bench core) + phase files
  dependencies: A2 (no phantom red in the pin block), A3 (Next projection)
  acceptance_criteria:
    - handoff-shape check reds a State section exceeding the constraint
    - /bench-debug's exit handoff writes `Repro:`; a fresh session can run it verbatim
  validation: A11 recovery measures (checkpoint completeness, cross-model resume, repeated dead ends)
  expected_benefit: resumability with less prose; the one missing field Bench actually lacks
  complexity: low
  risk: low
  migration: existing handoff files re-rendered by `bench handoff`

