  problem: 34 tickets-only spec folders (light-path route has no close step); inert `disable-model-invocation` on Codex adapters; 4 stale structure-accept rows; BENCH-reference/review prose describing a conformance phase that no longer exists; `bench outline` bare 24.6 KB; degraded git-guard rim matches substring `git`; three guard gaps; SessionStart silent on a missing core; `.logs`/evidence never pruned; landing guard removes a load-bearing dist/bench without warning.
  evidence: L-16, L-17, L-18, L-19, L-20, L-29, L-30; FT177/FT180
  proposed_change: delete reviewed residue and make the light-path landing commit consume its ticket (+ `specs: N tickets-only` row); delete the inert key; fix stale accept rows; fix the two prose passages; outline bare form → meta + per-dir counts; tokenize the degraded rim and add stash drop/clear, filter-branch, rm -rf; on 127 the SessionStart/doctor path prints the build/repair command; prune logs by count; landing guard warns before removing dist/bench.
  non_goals: no structure-policy decision (reviewer: gate at frozen budget or drop from status); no outline redesign.
  owner_layer: CLI + hooks + docs
  dependencies: A1 (prose fixes graded), A3 (status row)
  acceptance_criteria: each sub-item has a one-line check (count of tickets-only dirs = 0 after landing a light-path ticket; guard corpus; outline bytes; stale-accept lines = 0; hook output contains hint)
  validation: the per-item checks; A11 context measures for outline
  expected_benefit: less noise on the ambient board; fewer cold-start turns lost
