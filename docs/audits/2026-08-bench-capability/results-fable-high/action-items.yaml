# Final action portfolio — twelve items, ranked. This is the same portfolio as
# proposed-roadmap.md. Every item answers "how will we know this improved Bench?" in
# `validation`. Ledger ids refer to reconciliation-ledger.md; FT ids to the live board.

- id: A1
  priority: P0
  title: The dev gate grades the kit's own contracts — live-root conformance runs, an environment skip inside the oracle is red, and every skip is named
  problem: 29 registered conformance checks (docs, adapters, coverage-map validity, decision-map integrity, prose budgets, AXI registry) reach the live tree only through TestRootConformance, which skips without BENCH_CONFORMANCE_ROOT; only bench prep-release sets it. bench gate is green at HEAD while 10 diagnostics are red, and the footer hides the loss as "environment=1".
  evidence: L-01, L-21 (REPRODUCED — 3.2 s command; gate footer; phase table read); history — moved into a Go phase 2026-07-05 (72c037a1), removed 2026-08-09 (3701c4a0) with the profile stating the separate driver was retired but still claiming the gate enforces the contracts; FT120/FT213 occurrences show the skip being misread afterwards.
  proposed_change: >
    Carry BENCH_CONFORMANCE_ROOT=<graded root> and BENCH_CONFORMANCE_TIER=dev into the
    ordinary `go test -count=1 ./...` phase environment (or default the root when the
    graded root is the kit itself) — consistent with the profile's "one ordinary test
    driver" decision, no resurrected separate phase. In internal/gate/capability_skips.go,
    print each environment skip's test name and reason (the tally already keeps
    environmentReasons) and treat an environment-class skip inside the oracle as red.
    Then disposition the 10 diagnostics (fix the tree or, with reviewer approval, the
    contract) so HEAD is green again.
  non_goals: no new phase; no change to prep-release's ship tier; no prose rewrites beyond the 10 diagnostics; capability-class skips (fifo/privilege) stay footnotes.
  owner_layer: gate (Bench core) + conformance registry
  dependencies: none
  acceptance_criteria:
    - bench gate at 58d966e2 exits non-zero naming the 10 current diagnostics with their existing messages
    - after the fixes, bench gate is green and the test phase output shows TestRootConformance ran (not skipped)
    - deleting `## Entry orientation` from any .agents/commands/*.md reds the gate with docs-currency-workflow's own message; restoring greens it
    - removing the env assignment reds the gate with an "environment skip inside the oracle" message, not a footer count
    - skip line reads `class=environment: N (TestName: reason)` for every environment skip
    - added wall-clock reported in landing evidence (Opus measured +3.2 s on 64 s)
    - bench maps rc 0 (decision-map-integrity fixed by the same clean-up); FT133/FT120/FT213 skip occurrences closed or annotated
  validation: the red-first run at HEAD; two mutation probes of different kind and site (env removal; heading deletion); prep-release ship-tier conformance still green and not double-run; days-between-violation-and-detection metric drops from ≥6 to 0
  expected_benefit: six advisory surfaces become control at once; the kit's largest package starts paying rent; every later prose/router change is graded by the contracts it must keep
  complexity: low (env plumbing + skip rendering + 10 small fixes)
  risk: low; a contract that is genuinely stale surfaces immediately and is a reviewer decision, not a silent pass
  migration: none

- id: A2
  priority: P0
  title: One staleness rule for gate verdicts — reds are drift-checked, and status/handoff agree with bench gate
  problem: inspectSubjectAt returns on any non-green record before comparing trees, and status.GateVerdict defines Stale only for greens; after a red then a revert to a green-cached tree, bench gate reuses green while bench status headlines "gate red → fix before commit" and bench handoff would pin that red.
  evidence: L-02 (REPRODUCED in this run — three-command sequence)
  proposed_change: evaluate tree/oracle drift before the status branch in internal/gate/verdict.go inspectSubjectAt; define Stale on the record (any status) in internal/status/status.go; add the regression test asserting gate/status/handoff agreement across (green@T0 → red@T1 → revert→T0).
  non_goals: no second verdict store; no change to the evidence key or reuse semantics.
  owner_layer: gate + status (Bench core)
  dependencies: none
  acceptance_criteria:
    - the reproduction sequence yields status "gate green (reused)" or "stale — re-run" but never "red" for a tree with green evidence
    - handoff pin block never writes a red for a tree the evidence store holds green
    - regression test lands in internal/gate or internal/status and bites when either line is reverted
  validation: the regression test; a manual re-run of the sequence
  expected_benefit: the ambient dashboard and resume artifact stop contradicting the oracle; no phantom 65 s gate runs or phantom debugging sessions
  complexity: low (~20 lines + test)
  risk: none material
  migration: none

- id: A3
  priority: P1
  title: /bench front door — `bench status --route` emits one next[1]{state,why,command} row; staged-spec and un-adopted signals; invocable action column; rename what-next → drain
  problem: no surface routes from observed state; wrapper prints a 44-line inventory; binary says "no subcommand"; status prints "clean" in an un-adopted repo; a valid staged spec produces no row; six of eleven actions are prose; /bench-what-next is named like a router and is maintenance; ask-matt was never ported.
  evidence: L-03, L-08, L-15, L-16, L-31 (REPRODUCED)
  proposed_change: >
    Add `specs: staged` (from the spec Status reader) and `setup` (no .bench/) signals;
    normalize every status action to an invocable command or empty; add `--route`
    that ranks by the existing severity ordinals and emits exactly one row plus
    runners-up in one line; ship a thin model-invocable .agents/commands/bench.md
    (Claude) and $bench (Codex, allow_implicit_invocation false per policy) that
    invoke `bench status --route` and load only the recommended phase; make the
    wrapper's bare root print the route (inventory on `bench help`), and align the
    binary's no-arg/help with it; rename /bench-what-next → /bench-drain (adapters,
    anchors, README).
  non_goals: no new work-state file; no context compiler; no re-derivation of signals; no change to expert phases' behavior.
  owner_layer: CLI (status) + harness adapters
  dependencies: A1 (the docs/adapter contracts that grade the new phase file and rename); A2 (a router must not read a phantom red)
  acceptance_criteria:
    - fixture per scenario (un-adopted; clean+roadmap; unshaped idea; shaped map ready; staged spec; interrupted intent; gate red; dirty tree; staged+reviewed awaiting land) — each yields exactly one expected command
    - `bench status --route` in this repo at HEAD emits one row
    - Claude and Codex adapters render the same route with harness-native prefixes (existing handoff prefix test extended)
    - the wrapper's bare invocation and the binary's agree
    - conformance (A1) green after the rename
  validation: the scenario fixtures; A11 entry-point measures (steps to correct workflow, unnecessary questions, incorrect routing) before/after
  expected_benefit: user clarity; consistent entry across harnesses; the workflow middle becomes visible; Next has one owner
  complexity: medium (one flag, two signals, action normalization, two thin adapters, one rename)
  risk: medium — the rename touches anchors/tests; mitigated by A1 grading them
  migration: what-next → drain alias for one release; handoff `## Next command` keeps working unchanged

- id: A4
  priority: P1
  title: Adoption smoke — a newly adopted repo's scaffolded gate can go green
  problem: bench setup scaffolds no .bench/gate-inputs.json (gate env is PATH only → `HOME: unbound variable` in the wrapper under set -u), and the scaffolded gate.sh hard-fails on `bench canary` which exits 1 on the empty inventory every new repo has.
  evidence: L-14 (REPRODUCED end to end in a throwaway repo)
  proposed_change: setup scaffolds gate-inputs.json declaring HOME/BENCH_HOME; bin/bench.sh:14 names its own failure (`${BENCH_HOME:-${HOME:?…}}`); scaffolded canary line emitted commented with a TODO; a system-test fixture drives temp repo → setup → trivial real check → gate green.
  non_goals: no change to setup's plan-first UX (it is the best surface in the repo); no init/setup merge.
  owner_layer: adopt (Bench core) + wrapper
  dependencies: none
  acceptance_criteria:
    - the fixture passes; removing any of the three changes reds it with the named cause
    - `env -u HOME bash .bench/bin/bench.sh version` prints a self-naming error
  validation: the fixture; time-to-first-green for a new adopter (README clean-room step)
  expected_benefit: onboarding works; invariant 1 holds for adopters, not just the kit
  complexity: low
  risk: low
  migration: existing adopters unaffected (their gate-inputs.json/gate.sh are hand-configured)

