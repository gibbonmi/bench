function diffTable(text) {
  // unified diff → GitHub-style two-gutter table; file headers are dropped
  const rows = [];
  let oldN = 0, newN = 0;
  for (const l of text.split('\n')) {
    if (/^(diff |index |new file|deleted file|old mode|new mode|--- |\+\+\+ )/.test(l)) continue;
    const esc = l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const h = l.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
    if (h) { oldN = +h[1]; newN = +h[2]; rows.push(`<tr class="hunk"><td colspan="3">${esc}</td></tr>`); continue; }
    if (l.startsWith('+')) rows.push(`<tr class="add"><td class="ln"></td><td class="ln">${newN++}</td><td class="code">${esc}</td></tr>`);
    else if (l.startsWith('-')) rows.push(`<tr class="del"><td class="ln">${oldN++}</td><td class="ln"></td><td class="code">${esc}</td></tr>`);
    else if (l.startsWith('\\')) rows.push(`<tr><td class="ln"></td><td class="ln"></td><td class="code" style="color:#6e7681">${esc}</td></tr>`);
    else rows.push(`<tr><td class="ln">${oldN++}</td><td class="ln">${newN++}</td><td class="code">${esc}</td></tr>`);
  }
  return `<table>${rows.join('')}</table>`;
}

function trimToBox(from, to) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const m = 6;
  const t = 1 / Math.max(Math.abs(dx) / (from.w / 2 + m), Math.abs(dy) / (from.h / 2 + m));
  return { x: from.x + dx * t, y: from.y + dy * t };

function renderChain(lane, openStep) {

  const forkExtra = lane.ok ? boxW(lane.ok) + GAPX + 40 : 0;
  const W = Math.max(width(lane.before), width(lane.after) + forkExtra) + 20;
  const H = lane.ok ? 178 : 152;
  const svg = el('svg', { width: W, height: H });
  wrap.appendChild(svg);

  // BEFORE row (the old world: all grey, with the pain called out)

  let x = 58;
  lane.before.forEach((it, i) => {

      svg.appendChild(el('line', { x1: x + w + 4, y1: 31, x2: x + w + GAPX - 6, y2: 31, stroke: '#4d5761', 'stroke-width': 1.4, 'marker-end': 'url(#carr)' }));

  x = 58;
  const afterBoxes = [];
  lane.after.forEach((it, i) => {

    const r = el('rect', { x, y: ay, width: w, height: BH2, rx: 4, fill: st.fill, stroke: st.stroke, 'stroke-width': it.k === 'grey' || it.k === 'art' ? 1.2 : 1.7 });
    if (st.dash) r.setAttribute('stroke-dasharray', st.dash);
    g.appendChild(r);
    g.appendChild(el('text', { x: x + w / 2, y: ay + 17, 'text-anchor': 'middle', fill: st.text, 'font-size': 10.5, 'font-family': 'inherit' }, it.l));

    <div class="vd-body">
      <div class="vd-h">THE PROBLEM</div>
      <div class="vd-prose vd-reveal" id="vdProblem"></div>
      <div class="vd-h vd-reveal" id="vdHChange">THE CHANGE</div>
      <div class="vd-prose vd-reveal" id="vdChange"></div>
      <div class="vd-h vd-reveal" id="vdHConf">CONFIDENCE SCORE</div>
      <div class="vd-box vd-reveal" id="vdConfBox"><span id="vdConf"></span><span class="vd-caret" id="vdCaret"></span>
        <div class="vd-sub vd-reveal" id="vdJust"></div>
      </div>
      <div class="vd-h vd-reveal" id="vdHChains">CALL CHAINS · BEFORE → AFTER</div>
      <div id="vdChains"></div>
      <div class="vd-legend vd-reveal" id="vdChainLegend">
        <span style="color:#8b949e">grey = untouched context</span> ·
        <b style="color:#d29922">amber = modified</b> ·
        <b style="color:#3fb950">green dashed = NEW</b> ·
        <span style="color:#8b949e">dotted = build artifact</span> · click a colored box for detail
      </div>
      <div class="vd-h vd-reveal" id="vdHMap">CHANGE MAP</div>
      <div class="vd-diagram vd-reveal" id="vdDiagram"></div>
      <div class="vd-legend vd-reveal" id="vdLegend">
        <b style="color:#79c0ff">calls</b> · <b style="color:#d2a8ff">data-flow</b> · <b style="color:#ffa657">configures</b>
        &nbsp;|&nbsp; <span style="color:#3fb950">✓ direct tests</span> · <span style="color:#58a6ff">◆ end-to-end only</span> · <span style="color:#8b949e">🧪 test infra</span>
        &nbsp;|&nbsp; border = attention heat
      </div>
      <div class="vd-h vd-reveal" id="vdHObs">OBSERVABILITY · WHAT YOU WILL SEE IN OPERATION</div>
      <div id="vdObs"></div>
      <div class="vd-h vd-reveal" id="vdHRetro">RETRO · HOW THIS GOT BUILT</div>
      <div class="vd-reveal" id="vdRetro"></div>
      <div class="vd-h vd-reveal" id="vdHOrder">READING ORDER</div>
      <div id="vdRows"></div>
    </div>`;

  document.getElementById('vdProblem').textContent = report.problem;
  document.getElementById('vdChange').textContent = report.change;
  document.getElementById('vdReplay').onclick = render;

  // shared arrow markers for chains (one hidden svg)
  const mdefs = el('svg', { width: 0, height: 0 });
  const defsC = el('defs', {});
  [['carr','#4d5761'],['carrB','#79c0ff'],['carrG','#3fb950'],['carrR','#f85149']].forEach(([id, color]) => {
    const m = el('marker', { id, markerWidth: 8, markerHeight: 8, refX: 7, refY: 4, orient: 'auto' });
    m.appendChild(el('path', { d: 'M0,0 L8,4 L0,8 z', fill: color }));
    defsC.appendChild(m);
  });
  mdefs.appendChild(defsC);
  win.appendChild(mdefs);

  // --- hub graph ---
  const svg = el('svg', { width: GW, height: GH });
  document.getElementById('vdDiagram').appendChild(svg);
  const defs = el('defs', {});
  for (const [k, s] of Object.entries(EDGE)) {
    const m = el('marker', { id: 'arr-' + k, markerWidth: 9, markerHeight: 9, refX: 8, refY: 4.5, orient: 'auto' });
    m.appendChild(el('path', { d: 'M0,0 L9,4.5 L0,9 z', fill: s.hex }));
    defs.appendChild(m);
  }
  svg.appendChild(defs);

  const edgeEls = [];
  report.edges.forEach(e => {
    const a = boxOf(e.from), b = boxOf(e.to), s = EDGE[e.kind];
    const p1 = trimToBox(a, b), p2 = trimToBox(b, a);
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
    const bend = Math.min(26, len * 0.14);
    const cx = mx - dy / len * bend, cy = my + dx / len * bend;
    const g = el('g', { opacity: 0 });
    g.style.transition = 'opacity .3s';
    const path = el('path', { d: `M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}`, fill: 'none', stroke: s.hex, 'stroke-width': 1.7, 'marker-end': `url(#arr-${e.kind})` });
    if (s.dash) path.setAttribute('stroke-dasharray', s.dash);
    g.appendChild(path);
    const label = el('text', { x: cx, y: cy - 4, 'text-anchor': 'middle', 'font-size': 10, 'font-family': 'inherit', fill: s.hex, 'font-weight': 700 }, e.kind);
    g.appendChild(label);
    svg.appendChild(g);
    edgeEls.push({ g, path, e });
  });

  const nodeEls = {};
  for (const n of report.nodes.filter(n => n.group === 'flow')) {
    const b = boxOf(n.id);
    const g = el('g', { opacity: 0 });
    g.style.cursor = 'pointer';
    g.style.transition = 'opacity .35s';
    const rect = el('rect', { x: b.x - b.w / 2, y: b.y - b.h / 2, width: b.w, height: b.h, rx: 5,
      fill: n.attention === 'hotspot' ? '#31171a' : n.attention === 'focus' ? '#2c2311' : '#1c2321',
      stroke: HEAT[n.attention], 'stroke-width': n.id === 'f_core' ? 2.2 : 1.5 });
    if (n.status === 'new') rect.setAttribute('stroke-dasharray', '6 3');
    g.appendChild(rect);
    g.appendChild(el('text', { x: b.x, y: b.y - 3, 'text-anchor': 'middle', fill: '#e6edf3', 'font-size': n.id === 'f_core' ? 12 : 10.5, 'font-family': 'inherit' },
      base(n.path).length > 19 ? base(n.path).slice(0, 18) + '…' : base(n.path)));
    g.appendChild(el('text', { x: b.x, y: b.y + 14, 'text-anchor': 'middle', fill: cov(n).hex, 'font-size': 10 }, `${cov(n).sym} ${cov(n).word}`));
    g.onclick = ev => { ev.stopPropagation(); openStep(n.id, true); };
    svg.appendChild(g);
    nodeEls[n.id] = g;
  }

  // --- reading order: expandable steps ---
  const rowsHost = document.getElementById('vdRows');
  const stepEls = {};
  report.tour.forEach((id, i) => {
    const n = byId[id];
    const step = document.createElement('div');
    step.className = 'vd-step';
    const heatHtml = !n.heat ? '' :
      `<div class="vd-field"><span class="vd-lab ${n.attention === 'hotspot' ? 'hot' : 'warm'}">WHY ${n.attention === 'hotspot' ? 'HOT' : 'FOCUS'}</span><br><span class="txt">${n.heat.why}</span></div>` +
      (n.heat.improve ? `<div class="vd-field"><span class="vd-lab hot">WHAT WOULD COOL IT</span><br><span class="txt">${n.heat.improve}</span></div>` : '') +
      (n.heat.matters ? `<div class="vd-field"><span class="vd-lab hot">DOES IT MATTER</span><br><span class="txt">${n.heat.matters}</span></div>` : '');
    step.innerHTML = `<div class="head">
        <span class="vd-num">${i + 1}</span>
        <span class="vd-chip ${n.attention}">${n.attention === 'hotspot' ? 'HOT' : n.attention === 'focus' ? 'FOCUS' : 'LOW'}</span>
        <span><span class="vd-path">${n.path}</span> <span class="vd-stat">${n.stat}</span>${n.status === 'new' ? ' <span style="color:var(--new);font-size:11px;font-weight:700">NEW</span>' : ''}<br><span class="vd-note">${n.tourNote}</span></span>
        <span class="vd-badge" style="color:${cov(n).hex}">${cov(n).sym} ${cov(n).word}</span>
      </div>
      <div class="expand">
        <div class="vd-field" style="margin-top:4px"><span class="vd-difftoggle">+ view diff (${n.stat})</span><div class="vd-diff"></div></div>
        <div class="vd-role">${n.role}</div>
        <div class="vd-field"><span class="vd-lab">WHAT CHANGED</span><br><span class="txt">${n.whatChanged}</span></div>
        <div class="vd-field"><span class="vd-lab">WHY YOU SHOULD CARE</span><br><span class="txt">${n.whyCare}</span></div>
        <div class="vd-field"><span class="vd-lab">COVERAGE</span><br><span class="txt" style="color:${cov(n).hex}">${cov(n).sym} ${cov(n).word}</span> <span class="txt" style="color:var(--dim)">· ${n.via}</span></div>
        ${n.obs ? `<div class="vd-field"><span class="vd-lab obs">OBSERVABILITY</span><br><span class="txt">${n.obs}</span></div>` : ''}
        ${heatHtml}
        ${n.symbols.length ? `<div class="vd-field"><span class="vd-lab">SYMBOLS</span><br>${n.symbols.map(s => `<span class="vd-sym">${s}</span>`).join('')}</div>` : ''}
        <div class="vd-field"><span class="vd-lab">CONNECTIONS</span>${connectionsHtml(n)}</div>
      </div>`;
    step.querySelector('.head').onclick = () => openStep(id, false);
    const dt = step.querySelector('.vd-difftoggle');
    dt.onclick = ev => {
      ev.stopPropagation();
      const dv = step.querySelector('.vd-diff');
      const isOpen = dv.style.display === 'block';
      dv.style.display = isOpen ? 'none' : 'block';
      dt.textContent = `${isOpen ? '+' : '−'} view diff (${n.stat})`;
      if (!isOpen && !dv.dataset.filled) {
        dv.dataset.filled = '1';
        dv.innerHTML = diffTable(DIFFS[n.id] || 'diff not embedded in this prototype');
      }
    };
    rowsHost.appendChild(step);
    stepEls[id] = step;
  });

  function openStep(id, scrollTo) {
    const step = stepEls[id];
    const wasOpen = step.classList.contains('open');
    Object.values(stepEls).forEach(s => s.classList.remove('open'));
    if (wasOpen && !scrollTo) { spotlight(null); return; }
    step.classList.add('open');
    spotlight(id);
    if (scrollTo) step.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // --- call chains (need openStep, so built after it exists) ---
  const chainsHost = document.getElementById('vdChains');
  const laneEls = CHAINS.map(lane => {
    const w = renderChain(lane, openStep);
    chainsHost.appendChild(w);
    return w;
  });

  // --- observability list ---
  const obsHost = document.getElementById('vdObs');
  const obsEls = report.observability.map(o => {
    const d = document.createElement('div');
    d.className = 'vd-obs vd-reveal';
    d.innerHTML = `<span>👁</span><span class="txt">${o.see}</span><a>${base(byId[o.owner].path)}</a>`;
    d.querySelector('a').onclick = () => openStep(o.owner, true);
    obsHost.appendChild(d);
    return d;
  });

  // --- retro ---
  const retroHost = document.getElementById('vdRetro');
  retroHost.innerHTML = `
    <div class="vd-provenance">${report.retro.provenance}</div>
    <div class="vd-retro-sub">BUILD PATH</div>
    ${report.retro.commits.map(c => `<div class="vd-commit"><span class="h">${c.h}</span><span class="m">${c.m}</span><span class="n">${c.note}</span></div>`).join('')}
    <div class="vd-retro-sub">WHAT REVIEW CAUGHT</div>
    ${report.retro.reviewCaught.map((f, i) => `<div class="vd-found"><span>⚠</span><span class="txt">${f.t}</span><a data-owner="${f.owner}">${base(byId[f.owner].path)}</a></div>`).join('')}
    <div class="vd-retro-sub">PROCESS NOTES</div>
    ${report.retro.process.map(p => `<div class="vd-proc">· ${p}</div>`).join('')}`;
  retroHost.querySelectorAll('a[data-owner]').forEach(a => {
    a.onclick = () => openStep(a.dataset.owner, true);
  });

  const groupEls = [];
  const groups = [
    { title: 'TEST COVERAGE', key: 'tests', desc: n => `tests ${base(byId[n.tests].path)}` },
    { title: 'CONFIG & DOCS RIPPLE', key: 'ripple', desc: n => `${n.note} (${base(byId[n.touches].path)})` },
  ];
  for (const spec of groups) {
    const members = report.nodes.filter(n => n.group === spec.key);
    const g = document.createElement('div');
    g.className = 'vd-group';
    g.innerHTML = `<div class="head"><span class="tri">▶</span>
        <span class="vd-path">${spec.title}</span>
        <span class="vd-note">${members.length} files, expand when the flow above makes sense</span></div>
      <div class="members"></div>`;
    const host = g.querySelector('.members');
    for (const m of members) {
      const memEl = document.createElement('div');
      memEl.className = 'vd-member';
      memEl.innerHTML = `<div class="line">
          <span class="vd-chip ${m.attention}" style="font-size:10px">${m.attention === 'focus' ? 'FOCUS' : 'LOW'}</span>
          <span class="vd-path">${m.path}</span>${m.stat ? ` <span class="vd-stat">${m.stat}</span>` : ''}
          <span class="tgt">${spec.desc(m)}</span></div>
        <div class="mexp">${m.note ? m.note + ' · ' : ''}<span style="color:${cov(m).hex}">${cov(m).sym} ${cov(m).word}</span></div>`;
      memEl.querySelector('.line').onclick = ev => { ev.stopPropagation(); memEl.classList.toggle('open'); };
      host.appendChild(memEl);
    }
    g.querySelector('.head').onclick = () => g.classList.toggle('open');
    rowsHost.appendChild(g);
    groupEls.push(g);
  }

  function spotlight(id) {
    for (const [nid, nEl] of Object.entries(nodeEls)) nEl.setAttribute('opacity', !id || nid === id ? 1 : 0.22);
    edgeEls.forEach(({ g, e }) => g.setAttribute('opacity', !id || e.from === id || e.to === id ? 1 : 0.1));
  }

  // --- animation: any interaction fast-forwards the intro so timers never fight the user ---
  const show = id => document.getElementById(id).classList.add('shown');
  const confText = `${report.confidence.pct}% — ${report.confidence.verdict} · ${report.confidence.level}`;
  const confEl = document.getElementById('vdConf');
  let animDone = false;
  function finishIntro() {
    if (animDone) return;
    animDone = true;
    timers.forEach(clearTimeout); timers = [];
    win.querySelectorAll('.vd-reveal').forEach(e => e.classList.add('shown'));
    confEl.innerHTML = `<span class="big">${confText}</span>`;
    const j = document.getElementById('vdJust');
    j.textContent = '"' + report.confidence.justification + '"';
    const caret = document.getElementById('vdCaret');
    if (caret) caret.remove();
    edgeEls.forEach(({ g, path }) => {
      g.setAttribute('opacity', 1);
      path.style.transition = ''; path.style.strokeDasharray = ''; path.style.strokeDashoffset = '';
    });
    Object.values(nodeEls).forEach(nEl => nEl.setAttribute('opacity', 1));
    Object.values(stepEls).forEach(r => r.classList.add('shown'));
    groupEls.forEach(g => g.classList.add('shown'));
  }
  win.addEventListener('pointerdown', () => finishIntro(), true);
  if (!ANIMATE) finishIntro();

  later(150, () => show('vdProblem'));
  later(800, () => { show('vdHChange'); show('vdChange'); });
  later(1500, () => { show('vdHConf'); show('vdConfBox'); });
  later(1700, () => {
    let ci = 0;
    const typer = setInterval(() => {
      if (ci >= confText.length) {
        clearInterval(typer);
        if (animDone) return;
        confEl.innerHTML = `<span class="big">${confText}</span>`;
        const j = document.getElementById('vdJust');
        j.textContent = '"' + report.confidence.justification + '"';
        j.classList.add('shown');

        later(300, () => {
          show('vdHChains');
          laneEls.forEach((w, i) => later(200 + i * 380, () => w.classList.add('shown')));
          later(200 + laneEls.length * 380, () => show('vdChainLegend'));
          const afterChains = 300 + laneEls.length * 380 + 300;
          later(afterChains, () => {
            show('vdHMap'); show('vdDiagram'); show('vdLegend');
            const revealed = new Set();
            edgeEls.forEach(({ g, path, e }, i) => later(150 + i * 240, () => {
              for (const id of [e.from, e.to]) if (!revealed.has(id)) { revealed.add(id); nodeEls[id].setAttribute('opacity', 1); }
              const len = path.getTotalLength();
              if (!EDGE[e.kind].dash) {
                path.style.strokeDasharray = `${len}`;
                path.style.strokeDashoffset = len;
                path.style.transition = 'stroke-dashoffset .45s ease';
              }
              g.setAttribute('opacity', 1);
              if (!EDGE[e.kind].dash) requestAnimationFrame(() => path.style.strokeDashoffset = 0);
            }));
            const afterGraph = 150 + edgeEls.length * 240 + 250;
            later(afterGraph - 400, () => show('vdHObs'));
            obsEls.forEach((o, i) => later(afterGraph + i * 130, () => o.classList.add('shown')));
            const afterObs = afterGraph + obsEls.length * 130 + 150;
            later(afterObs, () => { show('vdHRetro'); show('vdRetro'); });
            const afterRetro = afterObs + 450;
            later(afterRetro - 150, () => show('vdHOrder'));
            report.tour.forEach((id, i) => later(afterRetro + i * 120, () => stepEls[id].classList.add('shown')));
            groupEls.forEach((g, i) => later(afterRetro + report.tour.length * 120 + i * 120, () => g.classList.add('shown')));
            later(afterRetro + (report.tour.length + 2) * 120, () => {
              animDone = true;
              const caret = document.getElementById('vdCaret');
              if (caret) caret.remove();
            });
          });
        });
        return;
      }
      confEl.textContent = confText.slice(0, ++ci);
    }, 20);
    timers.push(typer);
  });
}
render();
</script>
</body>
</html>
